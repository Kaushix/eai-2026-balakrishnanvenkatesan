openapi: 3.0.3
info:
  title: PA6 Checkout Orchestration API
  version: 1.0.0
  description: >-
    Contract for a checkout orchestration service. A checkout executes
    payment authorization, inventory reservation, shipping creation and
    notification delivery in strict sequence. When a later step fails,
    completed compensatable steps are reversed in reverse order.
  contact:
    name: PA6 Orchestrator

servers:
  - url: http://localhost:3000
    description: Local orchestrator

tags:
  - name: Health
    description: Service health
  - name: Checkout
    description: Checkout saga operations

paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check orchestrator health
      description: Reports whether the checkout orchestrator is running and ready to accept requests.
      responses:
        "200":
          description: The orchestrator is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /checkout:
    post:
      tags:
        - Checkout
      operationId: createCheckout
      summary: Execute a checkout saga
      description: >-
        Executes payment, inventory, shipping and notification strictly in
        that order. A downstream failure or timeout stops the forward saga.
        Inventory release and payment refund are the only compensations, and
        they run in reverse order after a later step fails.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Client key for retrying the same checkout. Reusing the key with
            the same request body returns the stored result. Reusing it with
            another body returns a payload-mismatch error. A concurrent use
            of the same key is rejected while the first request is running.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        description: Checkout order and notification information.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: All four forward steps completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The idempotency key conflicts with an in-progress request or is
            being reused with a different request payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            A downstream business operation failed, or a required
            compensation operation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "504":
          description: >-
            A downstream operation exceeded the configured request timeout.
            Completed compensatable steps are compensated before the response
            is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok

    CheckoutItem:
      type: object
      required:
        - sku
        - quantity
        - price
      properties:
        sku:
          type: string
          minLength: 1
          description: Stock-keeping unit identifier.
        quantity:
          type: integer
          minimum: 1
          description: Number of units requested.
        price:
          type: number
          minimum: 0
          description: Unit price.

    CheckoutRequest:
      type: object
      required:
        - orderId
        - items
        - amount
        - recipient
      properties:
        orderId:
          type: string
          minLength: 1
          description: Unique identifier of the order.
        customerId:
          type: string
          description: Optional customer identifier.
        recipient:
          type: string
          format: email
          description: Email address used by the notification step.
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: Bounded list of items reserved by the inventory step.
          items:
            $ref: "#/components/schemas/CheckoutItem"
        amount:
          type: number
          minimum: 0
          description: Total amount authorized by the payment step.

    TraceItem:
      type: object
      required:
        - step
        - status
        - startedAt
        - finishedAt
        - durationMs
      properties:
        step:
          type: string
          enum:
            - payment
            - inventory
            - shipping
            - notification
            - inventory_release
            - payment_refund
        status:
          type: string
          enum:
            - success
            - failed
            - timeout
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          minimum: 0

    CheckoutResponse:
      type: object
      required:
        - orderId
        - status
        - trace
      properties:
        orderId:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - completed
            - failed
            - compensated
        code:
          type: string
          enum:
            - timeout
            - compensation_failed
            - internal_error
        trace:
          type: array
          maxItems: 6
          description: >-
            Ordered execution record. A saga has at most four forward steps
            and two compensation steps.
          items:
            $ref: "#/components/schemas/TraceItem"

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - validation_error
            - idempotency_payload_mismatch
            - idempotency_conflict
        message:
          type: string
          minLength: 1
